<div class="modal-backdrop" (click)="close.emit()" role="presentation">
  <section class="modal card-modal" role="dialog" aria-modal="true" aria-labelledby="new-card-title" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div>
        <p class="eyebrow">{{ isEditing ? 'EDITAR CARD' : 'NOVO CARD' }}</p>
        <h2 id="new-card-title">
          {{ isEditing ? 'Atualize a tarefa' : 'Adicionar em ' + column?.nome }}
        </h2>
      </div>
      <button class="close" type="button" aria-label="Fechar" (click)="close.emit()">×</button>
    </div>
    <form (ngSubmit)="save.emit()">
      <label>
        Título
        <input [ngModel]="title" (ngModelChange)="titleChange.emit($event)" name="cardTitle" maxlength="100" required placeholder="Ex.: Revisar briefing" />
      </label>
      <label>
        Descrição
        <textarea [ngModel]="description" (ngModelChange)="descriptionChange.emit($event)" name="cardDescription" required placeholder="Descreva a tarefa"></textarea>
      </label>
      @if (isEditing) {
        <label>
          Coluna
          <select [ngModel]="columnId" (ngModelChange)="columnIdChange.emit($event)" name="cardColumnId" required>
            @for (boardColumn of orderedColumns(columns); track boardColumn.id ?? boardColumn.nome) {
              @if (boardColumn.id) {
                <option [ngValue]="boardColumn.id">{{ boardColumn.nome }}</option>
              }
            }
          </select>
        </label>
      }
      @if (error) {
        <p class="error" role="alert">{{ error }}</p>
      }
      <div class="modal-actions">
        <button class="secondary" type="button" (click)="close.emit()">Cancelar</button>
        <button type="submit" [disabled]="isSaving">
          {{ isSaving ? 'Salvando...' : isEditing ? 'Salvar alterações' : 'Criar card' }}
        </button>
      </div>
    </form>
  </section>
</div>
